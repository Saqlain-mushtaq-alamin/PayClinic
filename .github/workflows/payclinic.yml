name: PayClinic
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  payclinic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx packages/cli/src/cli.ts run --offline --json > payclinic-report.json
      - run: node --import tsx scripts/format-pr-comment.ts payclinic-report.json > payclinic-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: payclinic-report
          path: payclinic-report.json
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('payclinic-comment.md', 'utf8');
            await core.summary.addRaw(body).write();
            try {
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              if (issue_number) {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                const existing = comments.find((c) => c.body && c.body.includes('<!-- payclinic-report -->'));
                if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                else await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              core.warning(`Cannot post PR comment (fork PR or insufficient token permissions): ${err.message}`);
            }
