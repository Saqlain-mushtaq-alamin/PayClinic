services:
  - type: web
    name: payclinic
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run demo
    healthCheckPath: /api/health
    envVars:
      - key: PAYCLINIC_MODE
        value: offline
      - key: AI_PROVIDER
        value: fixture
      # Render sets NODE_ENV=production; keep devDependencies installed for the build.
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'
